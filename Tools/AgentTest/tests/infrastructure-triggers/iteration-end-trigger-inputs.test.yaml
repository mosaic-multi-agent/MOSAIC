schema_version: 1
name: iteration-end-trigger-inputs
id: 81
version: 1
changelog:
  - version: 1
    date: "2026-10-12"
    changes: "Initial."
description: >
  I-7: What an ITERATION_END trigger dispatch carries. Same boundary as I-3:
  implementation-review SUCCESS ends the Stage 1 iteration with checkpoints
  and commits enabled. The checkpoint-class dispatch must carry empty
  input_artifacts and output_artifacts and a task_description naming the
  trigger. The commit-class dispatch must carry the ended iteration's own
  artifacts - every path in an Input/Output cell of a Stage-block row that
  fills in {Stage}, resolved for Stage 1, registered, once each, in table
  order (Stage-1/Plan.md, Stage-1/PlanProgress.md, Stage-1/tests-review-tdd.md,
  Stage-1/implementation-review.md) and never ContractsDesign.md - with an
  empty output_artifacts and a task_description naming the iteration
  ("Stage 1"). Stage-1/implementation-review.md is registered only by the
  orchestrator's own bookkeeping of invocation 1, so it also proves the set is
  read after that write.
layer: orchestrator
negative: false

subject:
  identity: orchestrator
  agent: orchestrator
  workflows: [brownfield-tdd]
  infrastructure_agents: [checkpoint-iteration-end-only, commit-manager-git]
  opening_message: |
    Continue the existing workflow run. Read the Orchestration.md in the
    run-scoped folder and resume from where it left off. Do not ask me any
    further questions - proceed immediately and autonomously.
  invocation_kind: orchestrator
  allowed_tools: [Task, Read, Write, Edit, Bash, Glob, Grep]

stub_registry: iteration-end-trigger-inputs.stubs.json

timeout: 10m
turn_limit: 15
stop_after_invocations: 3

seed_files:
  - path: Orchestration-{run_id}/Orchestration.md
    ref: stage1-impl-done-both-enabled.md
  - path: Orchestration-{run_id}/Plan.md
    ref: Plan.md
  - path: Orchestration-{run_id}/Research.md
    ref: Research.md
  - path: Orchestration-{run_id}/Requirements.md
    ref: Requirements.md
  - path: Orchestration-{run_id}/ContractsDesign.md
    ref: ContractsDesign.md
  - path: Orchestration-{run_id}/Stage-1/Plan.md
    ref: Stage-1-Plan.md
  - path: Orchestration-{run_id}/Stage-1/PlanProgress.md
    ref: Stage-1-PlanProgress.md
  - path: Orchestration-{run_id}/Stage-1/tests-review-tdd.md
    ref: Stage-1-tests-review-tdd.md
  - path: Orchestration-{run_id}/Stage-2/Plan.md
    ref: Stage-2-Plan.md
  - path: Orchestration-{run_id}/Stage-2/PlanProgress.md
    ref: Stage-2-PlanProgress.md

assertions:
  invocation_sequence:
    exact: true
    steps:
      - { tool: dispatch, agent: implementation-review }
      - { tool: dispatch, agent: checkpoint-iteration-end-only }
      - { tool: dispatch, agent: commit-manager-git }

  task_messages:
    - at: 2
      identity: { tool: dispatch, agent: checkpoint-iteration-end-only }
      human_in_the_loop: false
      required_input_artifacts: []
      required_output_artifacts: []
      task_description_contains: ["ITERATION_END"]
    - at: 3
      identity: { tool: dispatch, agent: commit-manager-git }
      human_in_the_loop: false
      required_input_artifacts:
        - Orchestration-{run_id}/Stage-1/Plan.md
        - Orchestration-{run_id}/Stage-1/PlanProgress.md
        - Orchestration-{run_id}/Stage-1/tests-review-tdd.md
        - Orchestration-{run_id}/Stage-1/implementation-review.md
      required_output_artifacts: []
      task_description_contains: ["Stage 1"]
