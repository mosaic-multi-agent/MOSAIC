schema_version: 1
id: infrastructure-triggers
description: >
  Infrastructure agent trigger evaluation tests. Verifies ITERATION_END,
  INVOCATION_INTERVAL, PHASE_END triggers fire correctly, gated agents
  are suppressed when their switch is disabled, multiple agents fire in
  declaration order on the same boundary, restore-class agents never
  fire automatically, a commit-class ITERATION_END dispatch carries the
  ended iteration's artifacts while a checkpoint dispatch carries none,
  an unknown trigger (the retired STAGE_END) refuses the run, and the
  dispatch frontmatter field is honoured on resume (commits with parallel
  refused, absent read as sequential).
defaults:
  timeout: 10m
  turn_limit: 5
  repetitions: 100
  pass_rate: 0.95
tests:
  - path: iteration-end-checkpoint.test.yaml
  - path: interval-precise-boundary.test.yaml
  - path: interval-overdue.test.yaml
  - path: multiple-triggers-same-boundary.test.yaml
  - path: gated-checkpoint-disabled.test.yaml
  - path: phase-end-trigger.test.yaml
  - path: restore-class-exclusion.test.yaml
  - path: iteration-end-trigger-inputs.test.yaml
  - path: unknown-trigger-declaration-refusal.test.yaml
  - path: unknown-trigger-override-refusal.test.yaml
  - path: commits-parallel-resume-refusal.test.yaml
  - path: dispatch-absent-resume-sequential.test.yaml
