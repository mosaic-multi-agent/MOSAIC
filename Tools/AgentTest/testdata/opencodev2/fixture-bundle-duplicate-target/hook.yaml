schema_version: "1"
id: fixture-logger-v2-duplicate
version: 0.1.0
description: Fixture bundle whose opencode-v2 files declare the same target twice.

variants:
  opencode-v2:
    supported: true
    files:
      - source: plugin.ts
        target: mosaic-logger.ts
      - source: other.ts
        target: mosaic-logger.ts
    registration: []
