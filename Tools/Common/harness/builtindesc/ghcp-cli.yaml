schema_version: "1"
id: "ghcp-cli"
display_name: "GHCP CLI / VS Code GHCP Copilot"
transform_version: "3.0.0"

cli:
  label: "GitHub Copilot CLI"
  loading_mechanism: "name"
models:
  ids:
    - "claude-opus-5.5"
    - "claude-sonnet-5.5"
    - "claude-haiku-5.5"
    - "claude-fable-5.2"
    - "claude-fable-5.1"
    - "claude-fable-5"
    - "claude-sonnet-5"
    - "claude-sonnet-4.6"
    - "claude-haiku-4.5"
    - "gpt-6.2-astra"
    - "gpt-6.2-sol"
    - "gpt-6.1-terra"
    - "gpt-6.1-sol"
    - "gpt-6-astra"
    - "gpt-6-sol"
    - "gpt-6-luna"
    - "gpt-5.6-sol"
    - "gpt-5.6-luna"
    - "gpt-5.4-nano"
    - "gpt-5.3-codex"
    - "gemini-4-hydrogen"
    - "gemini-4-carbon"
    - "gemini-4-argon"
    - "gemini-3.8-flash"
    - "mai-code-2"
    - "mai-code-2-flash"
    - "mai-code-1.1-flash"
    - "kimi-k3"
    - "grok-4.7"
    - "grok-4.6"
  format_hint: "<vendor>-<model>-<version>, e.g. claude-opus-5.5 or gpt-6.2-sol"
tools:
  shape: list
  mcp:
    server_form: "{server}/*"
    tool_form: "{server}/{tool}"
  report_unknown_tool_names: true
  universe:
    - name: "read"
      unused: deny
      by_convention: false
    - name: "edit"
      unused: deny
      by_convention: false
    - name: "search"
      unused: deny
      by_convention: false
    - name: "execute"
      unused: deny
      by_convention: false
    - name: "ask_user"
      unused: deny
      by_convention: false
    - name: "agent"
      unused: deny
      by_convention: false
    - name: "skill"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      destinations:
        - to: main
          names:
            - "read"
    - generic: "file_write"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_edit"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_search"
      destinations:
        - to: main
          names:
            - "search"
    - generic: "content_search"
      destinations:
        - to: main
          names:
            - "search"
    - generic: "terminal"
      destinations:
        - to: main
          names:
            - "execute"
    - generic: "user_interaction"
      destinations:
        - to: main
          names:
            - "ask_user"
    - generic: "subagent"
      destinations:
        - to: main
          names:
            - "agent"
    - generic: "skill"
      destinations:
        - to: main
          names:
            - "skill"
  placeholder_expansion:
    - "read"
    - "edit"
    - "search"
    - "execute"
    - "ask_user"
    - "agent"

paths:
  agents:
    supported: true
    project: ".github/agents"
  skills:
    supported: true
    project: ".github/skills"
  hooks:
    supported: true
    project: ".github/hooks"

extensions:
  agent: ".agent.md"

frontmatter:
  model_key: "model"
  tools_key: "tools"
  add:
    - key: "user-invocable"
      value_by_role:
        subagent: false
        orchestrator: true
        utility: true
        standalone: true
  drop:
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
    - "infrastructure"
    - "triggers"
    - "on_failure"
  key_order:
    - "mosaic_id"
    - "version"
    - "mosaic_transform_version"
    - "mosaic_injections_version"
    - "name"
    - "description"
    - "model"
    - "tools"
    - "user-invocable"

hooks:
  supported: true
  variant_key: "ghcp-cli"
