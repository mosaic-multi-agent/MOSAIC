schema_version: "1"
id: "opencode"
display_name: "OpenCode"
transform_version: "3.0.0"

cli:
  label: "OpenCode CLI"
  loading_mechanism: "name"
models:
  ids:
    - "github-copilot/claude-opus-5.5"
    - "github-copilot/claude-sonnet-5.5"
    - "github-copilot/claude-haiku-5.5"
    - "github-copilot/claude-fable-5.2"
    - "github-copilot/claude-fable-5.1"
    - "github-copilot/claude-fable-5"
    - "github-copilot/claude-sonnet-5"
    - "github-copilot/claude-sonnet-4.6"
    - "github-copilot/claude-haiku-4.5"
    - "github-copilot/gpt-6.2-astra"
    - "github-copilot/gpt-6.2-sol"
    - "github-copilot/gpt-6.1-terra"
    - "github-copilot/gpt-6.1-sol"
    - "github-copilot/gpt-6-astra"
    - "github-copilot/gpt-6-sol"
    - "github-copilot/gpt-6-luna"
    - "github-copilot/gpt-5.6-sol"
    - "github-copilot/gpt-5.6-luna"
    - "github-copilot/gpt-5.4-nano"
    - "github-copilot/gpt-5.3-codex"
    - "github-copilot/gemini-4-hydrogen"
    - "github-copilot/gemini-4-carbon"
    - "github-copilot/gemini-4-argon"
    - "github-copilot/gemini-3.8-flash"
    - "github-copilot/mai-code-2"
    - "github-copilot/mai-code-2-flash"
    - "github-copilot/mai-code-1.1-flash"
    - "github-copilot/kimi-k3"
    - "github-copilot/grok-4.7"
    - "github-copilot/grok-4.6"
    - "openai/gpt-6.2-astra"
    - "openai/gpt-6.2-sol"
    - "openai/gpt-6.1-terra"
    - "openai/gpt-6.1-sol"
    - "openai/gpt-6-astra"
    - "openai/gpt-6-sol"
    - "openai/gpt-6-luna"
    - "anthropic/claude-opus-5-5"
    - "anthropic/claude-sonnet-5-5"
    - "anthropic/claude-haiku-5-5"
    - "anthropic/claude-fable-5-2"
    - "anthropic/claude-fable-5-1"
    - "anthropic/claude-fable-5"
    - "anthropic/claude-sonnet-5"
    - "anthropic/claude-opus-5"
    - "anthropic/claude-opus-4-8"
    - "anthropic/claude-opus-4-7"
    - "anthropic/claude-opus-4-6"
    - "anthropic/claude-sonnet-4-6"
    - "anthropic/claude-sonnet-4-5"
    - "anthropic/claude-haiku-4-5"
  format_hint: "provider/model-id"
tools:
  shape: permission
  mcp:
    server_form: "{server}_*"
    tool_form: "{server}_{tool}"
    extra_server_read_forms:
      - "{server}*"
    normalize_server_name: true
  universe:
    - name: "read"
      unused: deny
      by_convention: false
    - name: "write"
      unused: deny
      by_convention: false
    - name: "edit"
      unused: deny
      by_convention: false
    - name: "glob"
      unused: deny
      by_convention: false
    - name: "grep"
      unused: deny
      by_convention: false
    - name: "list"
      unused: deny
      by_convention: true
    - name: "bash"
      unused: deny
      by_convention: false
    - name: "patch"
      unused: deny
      by_convention: false
    - name: "webfetch"
      unused: deny
      by_convention: false
    - name: "question"
      unused: deny
      by_convention: false
    - name: "lsp"
      unused: deny
      by_convention: false
    - name: "task"
      unused: deny
      by_convention: false
    - name: "todowrite"
      unused: deny
      by_convention: false
    - name: "todoread"
      unused: deny
      by_convention: false
    - name: "skill"
      unused: deny
      by_convention: false
  mappings:
    - generic: "file_read"
      destinations:
        - to: main
          names:
            - "read"
    - generic: "file_write"
      destinations:
        - to: main
          names:
            - "write"
    - generic: "file_edit"
      destinations:
        - to: main
          names:
            - "edit"
    - generic: "file_search"
      destinations:
        - to: main
          names:
            - "glob"
    - generic: "content_search"
      destinations:
        - to: main
          names:
            - "grep"
    - generic: "terminal"
      destinations:
        - to: main
          names:
            - "bash"
    - generic: "user_interaction"
      destinations:
        - to: main
          names:
            - "question"
    - generic: "subagent"
      destinations:
        - to: main
          names:
            - "task"
    - generic: "skill"
      destinations:
        - to: main
          names:
            - "skill"
  placeholder_expansion:
    - "read"
    - "write"
    - "edit"
    - "glob"
    - "grep"
    - "bash"
    - "question"
    - "task"

paths:
  agents:
    supported: true
    project: ".opencode/agents"
  skills:
    supported: true
    project: ".opencode/skills"
  hooks:
    supported: true
    project: ".opencode/plugins"

extensions:
  agent: ".md"

frontmatter:
  model_key: "model"
  tools_key: "permission"
  drop:
    - "name"
    - "recommended_tier"
    - "tier_rationale"
    - "required_skills"
    - "tools"
    - "infrastructure"
    - "triggers"
    - "on_failure"
  add:
    - key: "mode"
      value_by_role:
        subagent: subagent
        orchestrator: primary
        utility: primary
        standalone: primary
  key_order:
    - "mosaic_id"
    - "version"
    - "mosaic_transform_version"
    - "mosaic_injections_version"
    - "description"
    - "mode"
    - "model"
    - "permission"

hooks:
  supported: true
  variant_key: "opencode"
