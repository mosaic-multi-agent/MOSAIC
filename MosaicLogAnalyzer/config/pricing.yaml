# MosaicLogAnalyzer pricing configuration
#
# Requests are priced by (provider, model). The provider is the one recorded on
# the usage record; provider IDs follow models.dev, for example anthropic,
# github-copilot, amazon-bedrock, google-vertex-anthropic.
#
#   providers:
#     <provider-id>:
#       models:
#         <model-id>: ...   prices requests that carry that provider
#   models:
#     <model-id>: ...       prices only requests that carry no provider
#
# Lookup is strict: there is no fallback between the two sections. A request with
# a provider is priced only from that provider's models; a request without a
# provider only from the top-level models. A request that matches nothing is
# unpriced. The same model ID may appear under several providers with different
# rates.
#
# Each model entry (in either section) has a standard rate set with exactly
# these five rates:
#
#   input           regular input tokens
#   cache_read      tokens read from the prompt cache
#   cache_write_5m  tokens written to the 5-minute cache tier
#   cache_write_1h  tokens written to the 1-hour cache tier
#   output          output tokens
#
# All rates are USD per million tokens (1,000,000 tokens). Write each rate as a
# quoted string, for example "3.00", so YAML does not parse it as a float.
#
# A model may also have one optional "long_context" block: a "threshold" (tokens
# per request) plus its own full rate set with the same five rates. A model has at
# most one long-context tier.
#
# When a usage record has no cache-write tier split, the cache write is assumed to
# use the 5-minute tier (cache_write_5m) as the fallback.
#
# Example provider entry without a long-context tier:
#
#   providers:
#     anthropic:
#       models:
#         example-model:
#           input: "3.00"
#           cache_read: "0.30"
#           cache_write_5m: "3.75"
#           cache_write_1h: "6.00"
#           output: "15.00"
#
# Example provider entry with a long-context tier:
#
#   providers:
#     github-copilot:
#       models:
#         example-long-context-model:
#           input: "3.00"
#           cache_read: "0.30"
#           cache_write_5m: "3.75"
#           cache_write_1h: "6.00"
#           output: "15.00"
#           long_context:
#             threshold: 200000
#             input: "6.00"
#             cache_read: "0.60"
#             cache_write_5m: "7.50"
#             cache_write_1h: "12.00"
#             output: "22.50"
#
# Example top-level entry for records without a provider:
#
#   models:
#     example-model:
#       input: "3.00"
#       cache_read: "0.30"
#       cache_write_5m: "3.75"
#       cache_write_1h: "6.00"
#       output: "15.00"

currency: USD
models: {}
providers:
  anthropic:
    models:
      claude-opus-5-5:
        input: "4"
        cache_read: "0.2"
        cache_write_5m: "5"
        cache_write_1h: "8"
        output: "20"
      claude-sonnet-5-5:
        input: "2"
        cache_read: "0.1"
        cache_write_5m: "2.5"
        cache_write_1h: "4"
        output: "10"
      claude-haiku-5-5:
        input: "0.10"
        cache_read: "0.01"
        cache_write_5m: "0.125"
        cache_write_1h: "0.20"
        output: "0.50"
        long_context:
          threshold: 100001
          input: "0.50"
          cache_read: "0.05"
          cache_write_5m: "0.625"
          cache_write_1h: "1"
          output: "2.50"
      claude-fable-5-1:
        input: "10"
        cache_read: "0.25"
        cache_write_5m: "12.50"
        cache_write_1h: "20"
        output: "50"
